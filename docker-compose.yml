services:
  backend:
    build: ./backend
    container_name: logloom-backend
    environment:
      DATABASE_URL: sqlite:////data/logloom.sqlite3
      WCL_CLIENT_ID: ${WCL_CLIENT_ID:-}
      WCL_CLIENT_SECRET: ${WCL_CLIENT_SECRET:-}
      WCL_TOKEN_URL: ${WCL_TOKEN_URL:-https://www.warcraftlogs.com/oauth/token}
      WCL_GRAPHQL_URL: ${WCL_GRAPHQL_URL:-https://fresh.warcraftlogs.com/api/v2/client}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
    volumes:
      - logloom_data:/data
    expose:
      - "8000"
    restart: unless-stopped
  frontend:
    build: ./frontend
    container_name: logloom-frontend
    ports:
      - "${LOGLOOM_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  logloom_data:
